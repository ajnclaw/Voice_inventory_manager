<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Shop Inventory Assistant</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #1a1d24;
    --bubble-user: #2d6cdf;
    --bubble-assistant: #262a33;
    --text: #e8eaed;
    --text-dim: #9aa0a6;
    --accent: #2d6cdf;
    --error: #e05252;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  header {
    padding: 14px 16px;
    background: var(--panel);
    border-bottom: 1px solid #2a2e37;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  header h1 {
    font-size: 16px;
    margin: 0;
    font-weight: 600;
  }

  header button {
    background: none;
    border: 1px solid #3a3f4b;
    color: var(--text-dim);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
  }

  header .header-actions {
    display: flex;
    gap: 8px;
  }

  #mute-btn.muted {
    color: var(--error);
    border-color: var(--error);
  }

  #mic-btn {
    border: none;
    border-radius: 50%;
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    background: #2a2e37;
    color: var(--text);
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #mic-btn.listening {
    background: var(--error);
    animation: pulse 1.2s infinite;
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(224, 82, 82, 0.5); }
    70% { box-shadow: 0 0 0 10px rgba(224, 82, 82, 0); }
    100% { box-shadow: 0 0 0 0 rgba(224, 82, 82, 0); }
  }

  #attach-btn {
    border: none;
    border-radius: 50%;
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    background: #2a2e37;
    color: var(--text);
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Buy/Sale hint chooser -- shown right after tapping attach */
  #hint-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 11;
  }

  #hint-card {
    width: 100%;
    max-width: 480px;
    background: var(--panel);
    border-radius: 16px 16px 0 0;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  #hint-card h2 {
    margin: 0 0 4px;
    font-size: 16px;
  }

  .hint-option {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    background: #2a2e37;
    color: var(--text);
    font-size: 15px;
    text-align: left;
  }

  .hint-option.secondary {
    color: var(--text-dim);
    text-align: center;
  }

  /* Bulk-import preview overlay */
  #import-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 10;
  }

  #import-card {
    width: 100%;
    max-width: 480px;
    max-height: 80vh;
    background: var(--panel);
    border-radius: 16px 16px 0 0;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  #import-card h2 {
    margin: 0;
    font-size: 16px;
  }

  #import-summary {
    color: var(--text-dim);
    font-size: 14px;
    margin: 0;
  }

  #import-items {
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .import-item {
    background: #2a2e37;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }

  .import-item .action-tag {
    font-size: 11px;
    text-transform: uppercase;
    color: var(--text-dim);
    flex-shrink: 0;
  }

  .import-item.result-success { border-left: 3px solid #4caf50; }
  .import-item.result-failed { border-left: 3px solid var(--error); }

  #import-actions {
    display: flex;
    gap: 8px;
  }

  #import-actions button {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    font-size: 15px;
    font-weight: 600;
  }

  #import-confirm-btn { background: var(--accent); color: white; }
  #import-cancel-btn { background: #2a2e37; color: var(--text); }

  /* Inventory table view -- a real table + totals, not a chat reply */
  #inventory-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    z-index: 12;
  }

  #inventory-header {
    padding: 14px 16px;
    background: var(--panel);
    border-bottom: 1px solid #2a2e37;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  #inventory-header h2 {
    margin: 0;
    font-size: 16px;
  }

  #inventory-close-btn {
    background: none;
    border: 1px solid #3a3f4b;
    color: var(--text-dim);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
  }

  #inventory-table-wrap {
    flex: 1;
    overflow: auto;
    padding: 12px 16px;
  }

  #inventory-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  #inventory-table th {
    text-align: left;
    color: var(--text-dim);
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    padding: 8px 10px;
    border-bottom: 1px solid #2a2e37;
    position: sticky;
    top: 0;
    background: var(--bg);
  }

  #inventory-table td {
    padding: 10px;
    border-bottom: 1px solid #1f232b;
  }

  #inventory-table tr.low-stock td:first-child {
    color: var(--error);
  }

  #inventory-table td.num {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  #inventory-summary-bar {
    padding: 14px 16px;
    background: var(--panel);
    border-top: 1px solid #2a2e37;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    font-size: 13px;
  }

  #inventory-summary-bar .stat-value {
    font-size: 18px;
    font-weight: 700;
    display: block;
  }

  #inventory-summary-bar .stat-label {
    color: var(--text-dim);
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .msg {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.4;
    font-size: 15px;
    white-space: pre-wrap;
  }

  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: white;
    border-bottom-right-radius: 4px;
  }

  .msg.assistant {
    align-self: flex-start;
    background: var(--bubble-assistant);
    border-bottom-left-radius: 4px;
  }

  .msg.error {
    align-self: flex-start;
    background: transparent;
    color: var(--error);
    font-size: 13px;
  }

  .msg.pending {
    opacity: 0.5;
  }

  .msg-time {
    display: block;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.55);
    margin-top: 4px;
    text-align: right;
  }

  .msg.assistant .msg-time, .msg.error .msg-time {
    color: var(--text-dim);
  }

  .msg-image {
    display: block;
    max-width: 100%;
    max-height: 260px;
    border-radius: 10px;
    margin-bottom: 4px;
    object-fit: contain;
  }

  .msg-file-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(0, 0, 0, 0.15);
    border-radius: 10px;
    padding: 8px 10px;
    margin-bottom: 4px;
    font-size: 13px;
  }

  #composer {
    display: flex;
    gap: 8px;
    padding: 12px;
    background: var(--panel);
    border-top: 1px solid #2a2e37;
  }

  #composer input {
    flex: 1;
    border: none;
    border-radius: 20px;
    padding: 12px 16px;
    background: #2a2e37;
    color: var(--text);
    font-size: 15px;
  }

  #composer input:focus {
    outline: 2px solid var(--accent);
  }

  #composer button {
    border: none;
    border-radius: 20px;
    padding: 0 18px;
    background: var(--accent);
    color: white;
    font-size: 15px;
    font-weight: 600;
  }

  #composer button:disabled {
    opacity: 0.5;
  }

  /* One-time token setup screen */
  #setup {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 24px;
    gap: 14px;
    text-align: center;
  }

  #setup p {
    color: var(--text-dim);
    font-size: 14px;
    max-width: 320px;
    margin: 0;
  }

  #setup input {
    width: 100%;
    max-width: 320px;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #3a3f4b;
    background: #2a2e37;
    color: var(--text);
    font-size: 15px;
  }

  #setup button {
    width: 100%;
    max-width: 320px;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 15px;
    font-weight: 600;
  }

  #setup-error {
    color: var(--error);
    font-size: 13px;
    min-height: 16px;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="app">
  <header>
    <h1>Shop Inventory</h1>
    <div class="header-actions">
      <button id="inventory-btn" title="View full inventory table">📊</button>
      <button id="mute-btn" title="Toggle spoken replies">🔊</button>
      <button id="clear-btn">Clear chat</button>
    </div>
  </header>

  <!-- Shown once, until a working token is stored in this browser -->
  <div id="setup">
    <p>Enter the access token for this shop's inventory server. You only
       need to do this once on this device.</p>
    <input id="token-input" type="password" placeholder="Access token" autocomplete="off">
    <button id="token-save">Save and connect</button>
    <div id="setup-error"></div>
  </div>

  <!-- Main chat UI, hidden until a token is set -->
  <div id="chat" class="hidden" style="display: contents;">
    <div id="messages"></div>
    <div id="composer">
      <button id="attach-btn" title="Import from file/photo">📎</button>
      <input id="file-input" type="file" accept=".txt,.csv,.pdf,image/*" capture="environment" class="hidden">
      <button id="mic-btn" title="Voice input">🎤</button>
      <input id="text-input" type="text" placeholder="Type a message..." autocomplete="off">
      <button id="send-btn">Send</button>
    </div>
  </div>

  <!-- Shown right after tapping attach, before the file picker opens.
       Telling the extractor upfront whether this is a purchase or a
       sale removes the hardest part of its job -- a buy bill and a
       sale bill can look structurally identical, so this is strictly
       better information than anything it could infer from the file
       itself. -->
  <div id="hint-overlay" class="hidden">
    <div id="hint-card">
      <h2>What kind of bill is this?</h2>
      <button id="hint-buy-btn" class="hint-option">📥 Purchase bill (stock coming in)</button>
      <button id="hint-sale-btn" class="hint-option">📤 Sale bill (stock going out)</button>
      <button id="hint-auto-btn" class="hint-option">✨ Not sure -- let it figure it out</button>
      <button id="hint-cancel-btn" class="hint-option secondary">Cancel</button>
    </div>
  </div>

  <!-- Bulk-import preview: shown after /upload extracts candidate
       items, until the owner confirms or cancels. Nothing in here has
       touched inventory.db yet. -->
  <div id="import-overlay" class="hidden">
    <div id="import-card">
      <h2>Review before saving</h2>
      <p id="import-summary"></p>
      <div id="import-items"></div>
      <div id="import-actions">
        <button id="import-cancel-btn">Cancel</button>
        <button id="import-confirm-btn">Confirm &amp; Save</button>
      </div>
    </div>
  </div>

  <!-- Inventory table view -- fetched fresh from GET /inventory, no
       LLM involved, so it's always exact and always fast. -->
  <div id="inventory-overlay" class="hidden">
    <div id="inventory-header">
      <h2>Full Inventory</h2>
      <button id="inventory-close-btn">Close</button>
    </div>
    <div id="inventory-table-wrap">
      <table id="inventory-table">
        <thead>
          <tr>
            <th>Item</th>
            <th>Category</th>
            <th class="num">Qty</th>
            <th class="num">Unit</th>
          </tr>
        </thead>
        <tbody id="inventory-table-body"></tbody>
      </table>
    </div>
    <div id="inventory-summary-bar">
      <div>
        <span id="stat-total-items" class="stat-value">--</span>
        <span class="stat-label">Items</span>
      </div>
      <div>
        <span id="stat-total-units" class="stat-value">--</span>
        <span class="stat-label">Total units</span>
      </div>
      <div>
        <span id="stat-low-stock" class="stat-value">--</span>
        <span class="stat-label">Low stock</span>
      </div>
      <div>
        <span id="stat-total-value" class="stat-value">--</span>
        <span class="stat-label">Est. value</span>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  const TOKEN_KEY = "agent_token";
  const MUTE_KEY = "agent_tts_muted";

  const setupEl = document.getElementById("setup");
  const chatEl = document.getElementById("chat");
  const messagesEl = document.getElementById("messages");
  const textInput = document.getElementById("text-input");
  const sendBtn = document.getElementById("send-btn");
  const clearBtn = document.getElementById("clear-btn");
  const micBtn = document.getElementById("mic-btn");
  const muteBtn = document.getElementById("mute-btn");
  const tokenInput = document.getElementById("token-input");
  const tokenSave = document.getElementById("token-save");
  const setupError = document.getElementById("setup-error");
  const attachBtn = document.getElementById("attach-btn");
  const fileInput = document.getElementById("file-input");
  const importOverlay = document.getElementById("import-overlay");
  const importSummary = document.getElementById("import-summary");
  const importItemsEl = document.getElementById("import-items");
  const importCancelBtn = document.getElementById("import-cancel-btn");
  const importConfirmBtn = document.getElementById("import-confirm-btn");
  const hintOverlay = document.getElementById("hint-overlay");
  const hintBuyBtn = document.getElementById("hint-buy-btn");
  const hintSaleBtn = document.getElementById("hint-sale-btn");
  const hintAutoBtn = document.getElementById("hint-auto-btn");
  const hintCancelBtn = document.getElementById("hint-cancel-btn");
  const inventoryBtn = document.getElementById("inventory-btn");
  const inventoryOverlay = document.getElementById("inventory-overlay");
  const inventoryCloseBtn = document.getElementById("inventory-close-btn");
  const inventoryTableBody = document.getElementById("inventory-table-body");

  function getToken() {
    return localStorage.getItem(TOKEN_KEY) || "";
  }

  function setToken(token) {
    localStorage.setItem(TOKEN_KEY, token);
  }

  function clearToken() {
    localStorage.removeItem(TOKEN_KEY);
  }

  function showSetup(message) {
    setupEl.classList.remove("hidden");
    chatEl.classList.add("hidden");
    setupError.textContent = message || "";
  }

  function showChat() {
    setupEl.classList.add("hidden");
    chatEl.classList.remove("hidden");
    textInput.focus();
  }

  function formatTime(date) {
    date = date || new Date();
    return date.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  }

  // Every message bubble is .msg > (.msg-body, .msg-time) -- kept as
  // two separate children (not one textContent blob) so later code
  // can replace just the body (e.g. "..." -> the real reply) via
  // setMessageBody() without wiping out the timestamp alongside it.
  function addMessage(role, text) {
    const el = document.createElement("div");
    el.className = "msg " + role;

    const body = document.createElement("div");
    body.className = "msg-body";
    body.textContent = text;
    el.appendChild(body);

    const time = document.createElement("span");
    time.className = "msg-time";
    time.textContent = formatTime();
    el.appendChild(time);

    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return el;
  }

  function setMessageBody(el, text) {
    const body = el.querySelector(".msg-body");
    if (body) body.textContent = text;
  }

  // Like addMessage, but shows the actual attached image inline (or a
  // file chip for non-images, e.g. a PDF) instead of just naming it --
  // same WhatsApp-style "here's what I sent" bubble, with an optional
  // caption line (used for the buy/sale hint label).
  function addAttachmentMessage(role, file, dataUrl, caption) {
    const el = document.createElement("div");
    el.className = "msg " + role;

    const body = document.createElement("div");
    body.className = "msg-body";

    if (file.type && file.type.startsWith("image/")) {
      const img = document.createElement("img");
      img.className = "msg-image";
      img.src = dataUrl;
      body.appendChild(img);
    } else {
      const chip = document.createElement("div");
      chip.className = "msg-file-chip";
      chip.textContent = "📄 " + file.name;
      body.appendChild(chip);
    }

    if (caption) {
      const captionEl = document.createElement("div");
      captionEl.textContent = caption;
      body.appendChild(captionEl);
    }

    el.appendChild(body);

    const time = document.createElement("span");
    time.className = "msg-time";
    time.textContent = formatTime();
    el.appendChild(time);

    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return el;
  }

  // ---- Text-to-speech: reads assistant replies aloud automatically.
  // Fully client-side (window.speechSynthesis), no server round-trip.
  // Muted state persists per-device via localStorage.

  function isMuted() {
    return localStorage.getItem(MUTE_KEY) === "1";
  }

  function setMuted(muted) {
    localStorage.setItem(MUTE_KEY, muted ? "1" : "0");
    muteBtn.textContent = muted ? "🔇" : "🔊";
    muteBtn.classList.toggle("muted", muted);
  }

  function speak(text) {
    if (isMuted() || !("speechSynthesis" in window) || !text) return;

    // Cancel anything still being read so replies don't overlap if the
    // owner sends messages faster than the previous reply finishes.
    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);
    // hi-IN rather than en-IN: replies are Hinglish (Hindi-English
    // code-mixed), and a Hindi voice generally handles common English
    // loanwords better than an English voice handles Hindi words --
    // there's no dedicated "Hinglish" voice/lang tag to pick from.
    utterance.lang = "hi-IN";
    window.speechSynthesis.speak(utterance);
  }

  muteBtn.addEventListener("click", function () {
    setMuted(!isMuted());
  });

  setMuted(isMuted());

  // ---- Speech-to-text: tap the mic, speak, it fills the input and
  // sends automatically once recognition finishes. Chrome on Android
  // (the default browser) supports this via webkitSpeechRecognition;
  // other browsers may not -- the mic button just hides itself if the
  // API isn't available, same page works fine with typing either way.

  const SpeechRecognitionApi = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognizer = null;
  let listening = false;

  if (!SpeechRecognitionApi) {
    micBtn.style.display = "none";
  } else {
    recognizer = new SpeechRecognitionApi();
    recognizer.lang = "en-IN";
    recognizer.interimResults = false;
    recognizer.continuous = false;

    recognizer.onresult = function (event) {
      const transcript = event.results[0][0].transcript;
      textInput.value = transcript;
      sendMessage();
    };

    recognizer.onerror = function (event) {
      addMessage("error", "Voice input error: " + event.error);
    };

    recognizer.onend = function () {
      listening = false;
      micBtn.classList.remove("listening");
    };

    micBtn.addEventListener("click", function () {
      if (listening) {
        recognizer.stop();
        return;
      }

      listening = true;
      micBtn.classList.add("listening");
      recognizer.start();
    });
  }

  async function callApi(path, options) {
    const token = getToken();

    const response = await fetch(path, {
      ...options,
      headers: {
        ...(options && options.headers),
        Authorization: "Bearer " + token,
      },
    });

    if (response.status === 401) {
      // Stored token is wrong or stale -- don't keep silently failing on
      // every message, force re-entry instead.
      clearToken();
      showSetup("That token was rejected. Enter it again.");
      throw new Error("unauthorized");
    }

    if (!response.ok) {
      throw new Error("Request failed: " + response.status);
    }

    return response.json();
  }

  async function sendMessage() {
    const text = textInput.value.trim();

    if (!text) return;

    textInput.value = "";
    sendBtn.disabled = true;

    addMessage("user", text);
    const pending = addMessage("assistant pending", "...");

    try {
      const data = await callApi("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text }),
      });

      setMessageBody(pending, data.reply || "(no reply)");
      pending.className = "msg assistant";
      speak(data.reply);
    } catch (err) {
      pending.remove();

      if (err.message !== "unauthorized") {
        addMessage("error", "Couldn't reach the server: " + err.message);
      }
    } finally {
      sendBtn.disabled = false;
      textInput.focus();
    }
  }

  async function clearConversation() {
    try {
      await callApi("/history", { method: "DELETE" });
      messagesEl.innerHTML = "";
    } catch (err) {
      if (err.message !== "unauthorized") {
        addMessage("error", "Couldn't clear history: " + err.message);
      }
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  clearBtn.addEventListener("click", clearConversation);

  textInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") sendMessage();
  });

  tokenSave.addEventListener("click", function () {
    const value = tokenInput.value.trim();

    if (!value) {
      setupError.textContent = "Paste the token first.";
      return;
    }

    setToken(value);
    showChat();
  });

  tokenInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") tokenSave.click();
  });

  // ---- Bulk import: attach a text/CSV file, a PDF, or a photo of a
  // handwritten note. The server (agent/import_extractor.py) reads it
  // and extracts candidate items WITHOUT writing anything yet -- this
  // shows the preview and only applies it once the owner confirms, so
  // a bad OCR/handwriting read can't silently corrupt real stock
  // counts. capture="environment" on the file input (see the HTML) is
  // what lets a phone offer "take photo" directly, not just "choose
  // existing file".

  const ACTION_LABELS = {
    restock: "+ Restock",
    sale: "- Sale",
    adjustment: "~ Adjust",
    new_item: "* New item",
  };

  let pendingItems = [];

  function fileToDataUrl(file) {
    return new Promise(function (resolve, reject) {
      const reader = new FileReader();

      reader.onload = function () {
        resolve(reader.result); // "data:<mime>;base64,<data>"
      };

      reader.onerror = function () {
        reject(new Error("Couldn't read that file."));
      };

      reader.readAsDataURL(file);
    });
  }

  async function fileToBase64(file) {
    // The server only wants the base64 payload, not the "data:..."
    // prefix -- strip it. Callers that also need to *display* the
    // file (e.g. an <img> src) should read fileToDataUrl once
    // themselves rather than this, to avoid reading the same file
    // twice.
    const dataUrl = await fileToDataUrl(file);
    const commaIndex = dataUrl.indexOf(",");
    return commaIndex >= 0 ? dataUrl.slice(commaIndex + 1) : dataUrl;
  }

  function describeItem(entry) {
    const label = ACTION_LABELS[entry.action] || entry.action;
    let line = `${label}: ${entry.item}`;

    if (entry.action === "adjustment") {
      // quantity is a CHANGE here (negative = lost/damaged, positive =
      // found extra), not a final count -- show the sign explicitly
      // so it doesn't read like an absolute total.
      if (entry.quantity != null) {
        const sign = entry.quantity > 0 ? "+" : "";
        line += ` (${sign}${entry.quantity})`;
      }
    } else if (entry.quantity != null) {
      line += ` x${entry.quantity}`;
    }

    if (entry.unit_price != null) line += ` @ Rs${entry.unit_price}`;
    if (entry.action === "adjustment" && entry.reason) line += ` -- ${entry.reason}`;

    return line;
  }

  function renderImportPreview(data) {
    pendingItems = Array.isArray(data.items) ? data.items : [];

    importSummary.textContent = data.summary || "";
    importItemsEl.innerHTML = "";

    if (pendingItems.length === 0) {
      const empty = document.createElement("div");
      empty.className = "import-item";
      empty.textContent = "Nothing usable was found in that file.";
      importItemsEl.appendChild(empty);
      importConfirmBtn.disabled = true;
    } else {
      importConfirmBtn.disabled = false;

      pendingItems.forEach(function (entry) {
        const row = document.createElement("div");
        row.className = "import-item";
        row.textContent = describeItem(entry);
        importItemsEl.appendChild(row);
      });
    }

    importConfirmBtn.textContent = "Confirm & Save";
    importConfirmBtn.disabled = pendingItems.length === 0;
    importCancelBtn.textContent = "Cancel";
    importOverlay.classList.remove("hidden");
  }

  function closeImportOverlay() {
    importOverlay.classList.add("hidden");
    pendingItems = [];
    fileInput.value = "";
  }

  function renderImportResults(results) {
    const rows = importItemsEl.children;

    results.forEach(function (result, index) {
      const row = rows[index];

      if (!row) return;

      row.classList.add(result.success ? "result-success" : "result-failed");

      if (!result.success && result.error) {
        row.textContent += " -- FAILED: " + result.error;
      }
    });

    const successCount = results.filter(function (r) { return r.success; }).length;

    importSummary.textContent =
      `Saved ${successCount} of ${results.length} item(s).`;

    importConfirmBtn.textContent = "Close";
    importConfirmBtn.disabled = false;
    importCancelBtn.classList.add("hidden");

    // Also drop a one-line record into the main chat log, consistent
    // with how a normal chat-based sale/restock gets confirmed.
    addMessage(
      "assistant",
      `Bulk import: saved ${successCount} of ${results.length} item(s).`
    );
  }

  let pendingHint = null; // "buy" | "sale" | null (null = let the model decide)

  function openHintChooser() {
    hintOverlay.classList.remove("hidden");
  }

  function closeHintChooser() {
    hintOverlay.classList.add("hidden");
  }

  function chooseHintAndPickFile(hint) {
    pendingHint = hint;
    closeHintChooser();
    fileInput.click();
  }

  attachBtn.addEventListener("click", openHintChooser);
  hintCancelBtn.addEventListener("click", closeHintChooser);
  hintBuyBtn.addEventListener("click", function () { chooseHintAndPickFile("buy"); });
  hintSaleBtn.addEventListener("click", function () { chooseHintAndPickFile("sale"); });
  hintAutoBtn.addEventListener("click", function () { chooseHintAndPickFile(null); });

  fileInput.addEventListener("change", async function () {
    const file = fileInput.files[0];

    if (!file) return;

    const hintLabel =
      pendingHint === "buy" ? "Marked as purchase" :
      pendingHint === "sale" ? "Marked as sale" : "";

    let dataUrl = null;

    try {
      dataUrl = await fileToDataUrl(file); // read once, reused below
      addAttachmentMessage("user", file, dataUrl, hintLabel);
    } catch (err) {
      // Couldn't even read the file locally -- fall back to a plain
      // text note so the attempt is still visible in the log.
      addMessage("user", `[attached: ${file.name}]`);
    }

    const pending = addMessage("assistant pending", "Reading file...");

    try {
      const commaIndex = dataUrl ? dataUrl.indexOf(",") : -1;
      const contentBase64 =
        commaIndex >= 0 ? dataUrl.slice(commaIndex + 1) : await fileToBase64(file);

      const data = await callApi("/upload", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          filename: file.name,
          mime_type: file.type,
          content_base64: contentBase64,
          hint: pendingHint,
        }),
      });

      pending.remove();
      renderImportPreview(data);
    } catch (err) {
      pending.remove();

      if (err.message !== "unauthorized") {
        addMessage("error", "Couldn't read that file: " + err.message);
      }
    } finally {
      pendingHint = null;
    }
  });

  importCancelBtn.addEventListener("click", function () {
    // Fire-and-forget: tells the backend this extraction was rejected
    // rather than saved (see agent/monitoring.py) -- purely a server-
    // side quality signal. Deliberately a raw fetch, not callApi(): on
    // a 401 callApi() would bounce the owner to the re-auth screen,
    // which is a real UI side effect this silent background beacon
    // should never cause. Never blocks the actual cancel either way.
    fetch("/import/cancel", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + getToken(),
      },
      body: JSON.stringify({ item_count: pendingItems.length }),
    }).catch(function () {});

    closeImportOverlay();
  });

  importConfirmBtn.addEventListener("click", async function () {
    // Second click, after results are already shown, just closes it.
    if (importConfirmBtn.textContent === "Close") {
      closeImportOverlay();
      return;
    }

    importConfirmBtn.disabled = true;
    importCancelBtn.disabled = true;

    try {
      const data = await callApi("/import/confirm", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ items: pendingItems }),
      });

      renderImportResults(data.results || []);
    } catch (err) {
      if (err.message !== "unauthorized") {
        addMessage("error", "Couldn't save the import: " + err.message);
      }
    } finally {
      importCancelBtn.disabled = false;
    }
  });

  // ---- Inventory table view: GET /inventory bypasses the LLM
  // entirely (see agent_server.py / agent/inventory_db.py's
  // inventory_overview()) -- a real table + totals, always exact,
  // always fast, instead of hoping a chat reply formats a long list
  // readably.

  function formatMoney(value) {
    if (value == null) return "--";
    return "Rs " + value.toLocaleString("en-IN", { maximumFractionDigits: 0 });
  }

  function formatQuantity(value) {
    // Quantities are REAL in the DB (supports fractional units like
    // kg/litre) but almost always whole numbers in practice -- don't
    // show "10.0" when "10" reads cleaner.
    return Number.isInteger(value) ? String(value) : value.toFixed(2);
  }

  async function openInventoryView() {
    inventoryTableBody.innerHTML = "<tr><td colspan=\"4\">Loading...</td></tr>";
    inventoryOverlay.classList.remove("hidden");

    try {
      const data = await callApi("/inventory", { method: "GET" });
      renderInventoryTable(data);
    } catch (err) {
      if (err.message !== "unauthorized") {
        inventoryTableBody.innerHTML =
          "<tr><td colspan=\"4\">Couldn't load inventory: " +
          err.message + "</td></tr>";
      }
    }
  }

  function renderInventoryTable(data) {
    const items = data.items || [];
    const summary = data.summary || {};

    inventoryTableBody.innerHTML = "";

    if (items.length === 0) {
      inventoryTableBody.innerHTML =
        "<tr><td colspan=\"4\">No items in the catalog yet.</td></tr>";
    } else {
      items.forEach(function (item) {
        const row = document.createElement("tr");
        const isLow =
          item.reorder_threshold != null &&
          item.current_quantity <= item.reorder_threshold;

        if (isLow) row.classList.add("low-stock");

        row.innerHTML =
          "<td>" + item.name + (isLow ? " ⚠️" : "") + "</td>" +
          "<td>" + (item.category || "--") + "</td>" +
          "<td class=\"num\">" + formatQuantity(item.current_quantity) + "</td>" +
          "<td class=\"num\">" + item.unit + "</td>";

        inventoryTableBody.appendChild(row);
      });
    }

    document.getElementById("stat-total-items").textContent = summary.total_items ?? "--";
    document.getElementById("stat-total-units").textContent =
      summary.total_units != null ? formatQuantity(summary.total_units) : "--";
    document.getElementById("stat-low-stock").textContent = summary.low_stock_count ?? "--";
    document.getElementById("stat-total-value").textContent = formatMoney(summary.total_value);
  }

  inventoryBtn.addEventListener("click", openInventoryView);
  inventoryCloseBtn.addEventListener("click", function () {
    inventoryOverlay.classList.add("hidden");
  });

  // On load: if a token is already stored, go straight to chat --
  // a wrong/stale one gets caught by the first 401 and bounces back
  // to the setup screen (see callApi above).
  if (getToken()) {
    showChat();
  } else {
    showSetup();
  }
})();
</script>

</body>
</html>
